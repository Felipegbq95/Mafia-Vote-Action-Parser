name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/mafia-vote-counter-app-mynzj7
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the static app files are published — test fixtures (real game
      # chat logs), README, and package.json stay out of the live site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js favicon.svg favicon.ico favicon-16.png favicon-32.png apple-touch-icon.png _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
